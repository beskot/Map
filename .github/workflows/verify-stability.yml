name: Build and test .NET 10

on:
  push:
    branches:
      - fix/axamlmapcontrol-stability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK and runtime information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore Map.sln

      - name: Build solution
        run: dotnet build Map.sln --configuration Release --no-restore

      - name: Run tests and collect coverage
        run: dotnet test AxamlMapControlTests/AxamlMapControlTests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 7
